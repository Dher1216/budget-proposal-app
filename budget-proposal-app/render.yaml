# Optional Render "Blueprint" definition.
#
# This file documents, in version control, the exact settings this app
# needs on Render -- most importantly the Build Command, which MUST include
# `psycopg2-binary` or the app crashes in production with
# `ModuleNotFoundError: No module named 'psycopg2'` (requirements.txt
# deliberately leaves it out -- see the comment there for why).
#
# IMPORTANT: adding this file to the repo does NOT, by itself, change
# anything about an already-existing Render service. Render only applies a
# render.yaml when you deploy a NEW service as a "Blueprint"
# (render.com -> New -> Blueprint), or if you explicitly connect an
# existing service to Blueprint sync. If your service was created the
# regular way (New -> Web Service), this file is just a reference -- the
# Build Command still has to be set by hand in that service's
# Settings -> Build & Deploy page. Use this file to copy/paste the exact
# command, or to recreate the service correctly from scratch if you ever
# need to.
#
# DATABASE_URL and BUDGET_APP_SECRET_KEY are marked `sync: false` so Render
# never overwrites your real values with blanks -- you still set those once
# in the dashboard (or get prompted for them on first Blueprint deploy).

services:
  - type: web
    name: budget-proposal-app
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt psycopg2-binary && python seed_data.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BUDGET_APP_SECRET_KEY
        sync: false
